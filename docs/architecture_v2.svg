        <text x="748" y="528" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#18201C">Agent</text>
        <text x="748" y="545" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="11" fill="#59635E">coverage score → warn</text>
        <g><rect fill="#C98A12" x="868" y="496" width="36" height="15" rx="2"/><text x="886" y="507" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="9" font-weight="500" fill="#FFFFFF">NEW</text></g>

        <rect x="506" y="490" width="176" height="64" rx="5" fill="#FFF2D4" stroke="#C98A12" stroke-width="2"/>
        <text x="520" y="513" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#18201C">7 Contradiction</text>
        <text x="520" y="528" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#18201C">Resolver</text>
        <text x="520" y="545" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="11" fill="#59635E">NLI + numeric → 3 classes</text>
        <g><rect fill="#C98A12" x="640" y="496" width="36" height="15" rx="2"/><text x="658" y="507" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="9" font-weight="500" fill="#FFFFFF">NEW</text></g>

        <rect x="278" y="490" width="176" height="64" rx="5" fill="#E4EEF8" stroke="#2C5A86" stroke-width="1.5"/>
        <text x="292" y="516" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#18201C">8 Generate</text>
        <text x="292" y="535" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="11" fill="#59635E">Gemma 4 E2B · + warnings</text>
        <g><rect fill="#2C5A86" x="418" y="472" width="36" height="15" rx="2"/><text x="436" y="483" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="9" font-weight="500" fill="#FFFFFF">UPG</text></g>

        <rect x="50" y="490" width="176" height="64" rx="5" fill="#FFFFFF" stroke="#C8CEC9" stroke-width="1.2"/>
        <text x="64" y="516" font-family="'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#18201C">9 Claim-Check Critic</text>
        <text x="64" y="535" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="11" fill="#59635E">NLI per sentence</text>

