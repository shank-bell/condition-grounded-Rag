        <line x1="962" y1="522" x2="912" y2="522" fill="none" stroke="#59635E" stroke-width="1.4" marker-end="url(#ah)"/>
        <line x1="734" y1="522" x2="684" y2="522" fill="none" stroke="#59635E" stroke-width="1.4" marker-end="url(#ah)"/>
        <line x1="506" y1="522" x2="456" y2="522" fill="none" stroke="#59635E" stroke-width="1.4" marker-end="url(#ah)"/>
        <line x1="278" y1="522" x2="228" y2="522" fill="none" stroke="#59635E" stroke-width="1.4" marker-end="url(#ah)"/>

