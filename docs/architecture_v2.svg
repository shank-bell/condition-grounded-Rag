        <text x="886" y="472" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#9A5A00">re-retrieve gap</text>
        <path d="M180 554 V584 H330 V556" fill="none" stroke="#59635E" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
        <text x="255" y="600" text-anchor="middle" font-family="'IBM Plex Mono',Consolas,'Courier New',monospace" font-size="10.5" fill="#59635E">regenerate ×1</text>

