# Shared defaults. Machine-specific overrides go in config.local.toml (git-ignored),
# e.g. a college PC with a bigger GPU:
#   [llm]
#   model = "gemma4:e4b"
#   [devices]
#   embedder = "cuda"
#   nli = "cuda"

[llm]
host = "http://localhost:11434"
model = "gemma4:e4b"
think = false                # thinking off: faster, and JSON extraction doesn't need it
num_ctx = 8192
keep_alive = "15m"
extract_temperature = 0.0
generate_temperature = 0.2

[agents]                     # a different open-weights model per agent (any Ollama tag, e.g. "hf.co/<user>/<repo>")
orchestrator_model = ""      # empty = [llm].model
applicability_model = ""
fallback_model = ""          # the bigger model an agent escalates to on a bad outcome; empty = [llm].model

[models]
embedder = "BAAI/bge-m3"
reranker = "BAAI/bge-reranker-base"          # Stage 5; 10 Oct: the stronger fallback of docs/backup_models_huggingface.md (was cross-encoder/ms-marco-MiniLM-L-6-v2)
text_relevance = "cross-encoder/ms-marco-MiniLM-L-6-v2"   # Stage 7 text-only path: its fixed cut-off was calibrated on this model
nli = "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
query_classifier = "allenai/scibert_scivocab_uncased"

[devices]                    # "cuda" or "cpu"; 6 GB VRAM is shared with the Ollama model
embedder = "cpu"
reranker = "cpu"
nli = "cpu"
classifier = "cpu"

[paths]
papers_dir = "data/papers"
index_dir = "data/index"
profile_db = "data/index/profiles.sqlite"
chroma_dir = "data/index/chroma"
bm25_path = "data/index/bm25.pkl"

[chunking]
chunk_size = 2000
chunk_overlap = 200

[retrieval]
dense_k = 30
bm25_k = 30
rrf_k = 60
fused_top = 20
rerank_keep = 10
rerank_threshold = -3.0      # cross-encoder logit (raw, not sigmoid); bge-reranker-base: -3.0 keeps as many passages as MiniLM did at -2.0 (7.2 on average) with a higher hit rate (10 Oct sweep)
section_boost = 0.15         # soft boost for chunks whose section matches the intent
generate_top = 5
use_cards = true             # retrieval cards: a short summary of what a chunk records (from its profiles) for dense + keyword search and the reranker

[applicability]
max_reretrieve = 1

[contradiction]
nli_threshold = 0.70         # contradiction probability that flags a candidate pair
numeric_rel_diff = 0.02      # same-metric values differing by more than this flag a pair
max_pairs = 45
human_rows_not_comparable = true    # fix A (8 Oct): a "Human" row is never compared as a model result
two_metric_tasks_no_genuine = true  # fix A: MRPC / QQP / STS-B single numbers can be acc, F1 or their mean -> no GENUINE
mnli_split_tags = true              # fix A: MNLI matched / mismatched counts as a split difference
one_sided_conditions_explain = true  # policy B (10 Oct; ON since 11 Oct together with table grounding): a condition recorded for only one paper = probable explanation (EXPLAINED, hedged) instead of NOT_COMPARABLE. With grounding: 46 of 50 on the third fresh set (42 without, 45 for 'always EXPLAINED'), 88 % over 250 pairs against 82 %; alone it equalled 'always EXPLAINED'
table_grounding = true            # 10 Oct: read each card's own table cell again (block heading, caption, row / column labels): fills split, system kind and size, flags cards that do not fit their cell (44 of 50 right on a clean set, 34 without)

[critic]
entail_threshold = 0.50
max_regenerate = 1

[ragas]                      # only used when [features] ragas_loop = true (off: the design replaced the runtime RAGAS loop by the NLI critic above)
threshold = 0.80             # share of the answer's statements the passages must support
max_retries = 3              # the original design: up to 3 rewrites
judge_model = ""             # empty = the answer model (same family as the writer); "llama3.1:8b" = an independent judge (needs ~5 GB more GPU memory)
max_context_chars = 16000

# Ablation switches (used by the evaluation)
[features]
orchestrator_agent = true    # false: fixed rules decide the path instead of the planner agent
applicability_agent = true   # false: the deterministic matcher alone decides coverage
applicability = true
contradiction = true
critic = true
profile_in_context = true
escalation = true            # a small-model agent hands a bad outcome (unusable output, weak retrieval, "not covered") to fallback_model
profile_guided_retrieval = true   # Stage 6 also pulls chunks whose profiles record a missing condition
joint_coverage = true        # Stage 6 also requires the named model, dataset and language to be recorded TOGETHER by one result (see docs/oct1_fixes_and_metrics.md)
joint_setting = true         # ... and a setting the question names ("5-shot", "zero-shot", "dev set") to be recorded together with them (11 Oct)
ragas_loop = false           # the original design's runtime loop (rewrite the answer while its RAGAS-style faithfulness is below [ragas].threshold): +14-22 s per question
