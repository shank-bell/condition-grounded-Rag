
[llm]
host = "http://localhost:11434"
model = "gemma4:e4b"
think = false
num_ctx = 8192
keep_alive = "15m"
extract_temperature = 0.0
generate_temperature = 0.2

[models]
embedder = "BAAI/bge-m3"
reranker = "cross-encoder/ms-marco-MiniLM-L-6-v2"
nli = "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
query_classifier = "allenai/scibert_scivocab_uncased"

[devices]
embedder = "cpu"
reranker = "cpu"
nli = "cpu"
classifier = "cpu"

[paths]
papers_dir = "data/papers"
index_dir = "data/index"
profile_db = "data/index/profiles.sqlite"
chroma_dir = "data/index/chroma"
bm25_path = "data/index/bm25.pkl"

[chunking]
chunk_size = 2000
chunk_overlap = 200

[retrieval]
dense_k = 30
bm25_k = 30
rrf_k = 60
fused_top = 20
rerank_keep = 10
rerank_threshold = -2.0
section_boost = 0.15
generate_top = 5

[applicability]
max_reretrieve = 1

[contradiction]
nli_threshold = 0.70
numeric_rel_diff = 0.02
max_pairs = 45

[critic]
entail_threshold = 0.50
max_regenerate = 1

[features]
applicability = true
contradiction = true
critic = true
profile_in_context = true
