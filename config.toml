
[llm]
host = "http://localhost:11434"
model = "gemma4:e4b"
think = false
num_ctx = 8192
keep_alive = "15m"
extract_temperature = 0.0
generate_temperature = 0.2

[agents]
orchestrator_model = ""
applicability_model = ""
fallback_model = ""

[models]
embedder = "BAAI/bge-m3"
reranker = "BAAI/bge-reranker-base"
text_relevance = "cross-encoder/ms-marco-MiniLM-L-6-v2"
nli = "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
query_classifier = "allenai/scibert_scivocab_uncased"

[devices]
embedder = "cpu"
reranker = "cpu"
nli = "cpu"
classifier = "cpu"

[paths]
papers_dir = "data/papers"
index_dir = "data/index"
profile_db = "data/index/profiles.sqlite"
chroma_dir = "data/index/chroma"
bm25_path = "data/index/bm25.pkl"

[chunking]
chunk_size = 2000
chunk_overlap = 200

[retrieval]
dense_k = 30
bm25_k = 30
rrf_k = 60
fused_top = 20
rerank_keep = 10
rerank_threshold = -3.0
section_boost = 0.15
generate_top = 5
use_cards = true

[applicability]
max_reretrieve = 1

[contradiction]
nli_threshold = 0.70
numeric_rel_diff = 0.02
max_pairs = 45
human_rows_not_comparable = true
two_metric_tasks_no_genuine = true
mnli_split_tags = true
one_sided_conditions_explain = true
table_grounding = true

[critic]
entail_threshold = 0.50
max_regenerate = 1

[ragas]
threshold = 0.80
max_retries = 3
judge_model = ""
max_context_chars = 16000

[features]
orchestrator_agent = true
applicability_agent = true
applicability = true
contradiction = true
critic = true
profile_in_context = true
escalation = true
profile_guided_retrieval = true
joint_coverage = true
joint_setting = true
ragas_loop = false
